# ==============================================================================
# MiniTmux Configuration (etc/tmux.conf)
# Battery-included, native Windows-optimized tmux runtime configuration.
# ==============================================================================

# --- Shell & Core Performance ---
set -g default-shell /usr/bin/bash
set -g history-limit 100000
set -s escape-time 10
set -g focus-events on
set -g mouse on
set -g renumber-windows on

# --- Path & Environment Sanitization ---
set-environment -g MSYS "noglob"
set-environment -g LANG "en_US.UTF-8"
set-environment -g LC_ALL "en_US.UTF-8"
set-environment -g PATH "/usr/bin:/cygdrive/c/WINDOWS/system32:/cygdrive/c/WINDOWS:/cygdrive/c/Program Files/nodejs"

# --- Terminal & Truecolor (24-bit) Support ---
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",*256col*:RGB"
set -ga terminal-overrides ",xterm*:Tc"
set -ga terminal-overrides ",xterm*:RGB"

# --- Ergonomic Window & Pane Splitting ---
# Split keeping the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Secondary fallback splits
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# --- Navigation ---
# Vim-style pane navigation (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + Arrow pane navigation (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Pane Resizing (-r allows repeatable key presses)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick configuration reload
bind r source-file /etc/tmux.conf \; display-message " MiniTmux config reloaded!"

# --- Windows Native Clipboard Integration ---
setw -g mode-keys vi
set -s set-clipboard on

# Copy selection to Windows clipboard via clip.exe
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "/cygdrive/c/Windows/System32/clip.exe"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "/cygdrive/c/Windows/System32/clip.exe"
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "/cygdrive/c/Windows/System32/clip.exe"

# Paste from Windows clipboard into active pane
bind ] run-shell "powershell.exe -NoProfile -Command Get-Clipboard | tr -d '\\r' | tmux load-buffer - ; tmux paste-buffer"
bind C-v run-shell "powershell.exe -NoProfile -Command Get-Clipboard | tr -d '\\r' | tmux load-buffer - ; tmux paste-buffer"

# --- Modern Statusline & Visual Theme ---
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left status: Session badge
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold]  #S #[bg=#1e1e2e,fg=#89b4fa] "

# Right status: Time, date, and MiniTmux branding badge
set -g status-right-length 100
set -g status-right "#[fg=#a6adc8]%H:%M #[fg=#6c7086]| #[fg=#a6adc8]%d-%b #[bg=#a6e3a1,fg=#11111b,bold] MiniTmux "

# Window tabs styling
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I:#W* #[bg=#1e1e2e]"

# Pane border styling
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message styling
set -g message-style "bg=#89b4fa,fg=#11111b,bold"
