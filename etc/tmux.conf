# ==============================================================================
# MiniTmux Configuration (etc/tmux.conf) - Performance Optimized
# Battery-included, native Windows & macOS cross-platform tmux configuration.
# ==============================================================================

# --- Shell & Core Performance (Zero-Latency Engine) ---
if-shell "uname | grep -qiE 'msys|cygwin'" \
    "set -g default-shell /usr/bin/bash ; set-environment -g MSYS 'noglob disable_pcon winsymlinks:nativestrict' ; set-environment -g PATH '/usr/bin:/cygdrive/c/WINDOWS/system32:/cygdrive/c/WINDOWS'"

set -g history-limit 50000
set -s escape-time 0
set -g focus-events on
set -g mouse on
set -g renumber-windows on
set-environment -g LANG "en_US.UTF-8"
set-environment -g LC_ALL "en_US.UTF-8"

# --- Terminal & Truecolor (24-bit) Throughput ---
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",*256col*:RGB"
set -ga terminal-overrides ",xterm*:Tc"
set -ga terminal-overrides ",xterm*:RGB"

# --- Ergonomic Window & Pane Splitting ---
# Split keeping the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Secondary fallback splits
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# --- Instant AI Agent Panel Spawning ---
# Prefix + A   : Split horizontally (right) with agy running
# Prefix + C-a : Split vertically (down) with agy running
bind A split-window -h -c "#{pane_current_path}" "agy; exec \${SHELL:-bash}"
bind C-a split-window -v -c "#{pane_current_path}" "agy; exec \${SHELL:-bash}"

# --- Navigation ---
# Vim-style pane navigation (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + Arrow pane navigation (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Pane Resizing (-r allows repeatable key presses)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick configuration reload (cross-platform path resolution)
bind r run-shell 'if [ -n "$TMUX_CONF" ] && [ -f "$TMUX_CONF" ]; then tmux source-file "$TMUX_CONF"; elif [ -f ~/.config/mtmux/tmux.conf ]; then tmux source-file ~/.config/mtmux/tmux.conf; elif [ -f /etc/tmux.conf ]; then tmux source-file /etc/tmux.conf; fi; tmux display-message " MiniTmux config reloaded!"'

# --- Clipboard Integration ---
setw -g mode-keys vi
set -s set-clipboard on

if-shell "uname | grep -qi darwin" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy' ; \
     bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy' ; \
     bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel 'pbcopy' ; \
     bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy' ; \
     bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy' ; \
     bind ] run-shell 'pbpaste | tmux load-buffer - ; tmux paste-buffer' ; \
     bind C-v run-shell 'pbpaste | tmux load-buffer - ; tmux paste-buffer'" \
    "if-shell 'uname | grep -qiE \"msys|cygwin\"' \
        'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \"/cygdrive/c/Windows/System32/clip.exe\" ; \
         bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel \"/cygdrive/c/Windows/System32/clip.exe\" ; \
         bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel \"/cygdrive/c/Windows/System32/clip.exe\" ; \
         bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \"/cygdrive/c/Windows/System32/clip.exe\" ; \
         bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \"/cygdrive/c/Windows/System32/clip.exe\" ; \
         bind ] run-shell \"winpaste.exe | tr -d \\\"\\r\\\" | tmux load-buffer - ; tmux paste-buffer\" ; \
         bind C-v run-shell \"winpaste.exe | tr -d \\\"\\r\\\" | tmux load-buffer - ; tmux paste-buffer\"' \
        'if-shell \"command -v wl-copy >/dev/null 2>&1\" \
            \"bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \\\"wl-copy\\\" ; \
             bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel \\\"wl-copy\\\" ; \
             bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel \\\"wl-copy\\\" ; \
             bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \\\"wl-copy\\\" ; \
             bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \\\"wl-copy\\\" ; \
             bind ] run-shell \\\"wl-paste -n | tmux load-buffer - ; tmux paste-buffer\\\" ; \
             bind C-v run-shell \\\"wl-paste -n | tmux load-buffer - ; tmux paste-buffer\\\"\" \
            \"bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \\\"xclip -selection clipboard\\\" ; \
             bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel \\\"xclip -selection clipboard\\\" ; \
             bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel \\\"xclip -selection clipboard\\\" ; \
             bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \\\"xclip -selection clipboard\\\" ; \
             bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \\\"xclip -selection clipboard\\\" ; \
             bind ] run-shell \\\"xclip -o -selection clipboard | tmux load-buffer - ; tmux paste-buffer\\\" ; \
             bind C-v run-shell \\\"xclip -o -selection clipboard | tmux load-buffer - ; tmux paste-buffer\\\"\"'"

# --- Statusline Structure (Low-CPU Refresh) ---
set -g status on
set -g status-interval 15
set -g status-position bottom

# --- Load Active Theme (defaults to Catppuccin Mocha) ---
if-shell "test -f ~/.config/mtmux/current.conf" \
    "source-file ~/.config/mtmux/current.conf" \
    "if-shell 'test -f /etc/themes/current.conf' 'source-file /etc/themes/current.conf' 'if-shell \"test -f /etc/themes/catppuccin-mocha.conf\" \"source-file /etc/themes/catppuccin-mocha.conf\"'"
