# Gruvbox Dark theme for MiniTmux
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left-length 40
set -g status-left "#[bg=#fabd2f,fg=#282828,bold]  #S #[bg=#282828,fg=#fabd2f] "
set -g status-right-length 100
set -g status-right "#[fg=#d5c4a1]%H:%M #[fg=#665c54]| #[fg=#d5c4a1]%d-%b #[bg=#b8bb26,fg=#282828,bold] MiniTmux "
setw -g window-status-format "#[fg=#928374] #I:#W "
setw -g window-status-current-format "#[bg=#3c3836,fg=#ebdbb2,bold] #I:#W* #[bg=#282828]"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"
set -g message-style "bg=#fabd2f,fg=#282828,bold"
