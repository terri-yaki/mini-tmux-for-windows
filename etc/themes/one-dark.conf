# One Dark theme for MiniTmux
set -g status-style "bg=#282c34,fg=#abb2bf"
set -g status-left-length 40
set -g status-left "#[bg=#61afef,fg=#282c34,bold]  #S #[bg=#282c34,fg=#61afef] "
set -g status-right-length 100
set -g status-right "#[fg=#98c379]%H:%M #[fg=#5c6370]| #[fg=#98c379]%d-%b #[bg=#e5c07b,fg=#282c34,bold] MiniTmux "
setw -g window-status-format "#[fg=#5c6370] #I:#W "
setw -g window-status-current-format "#[bg=#3e4451,fg=#abb2bf,bold] #I:#W* #[bg=#282c34]"
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"
set -g message-style "bg=#61afef,fg=#282c34,bold"
