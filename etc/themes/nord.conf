# Nord theme for MiniTmux
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left-length 40
set -g status-left "#[bg=#88c0d0,fg=#2e3440,bold]  #S #[bg=#2e3440,fg=#88c0d0] "
set -g status-right-length 100
set -g status-right "#[fg=#81a1c1]%H:%M #[fg=#4c566a]| #[fg=#81a1c1]%d-%b #[bg=#a3be8c,fg=#2e3440,bold] MiniTmux "
setw -g window-status-format "#[fg=#4c566a] #I:#W "
setw -g window-status-current-format "#[bg=#3b4252,fg=#eceff4,bold] #I:#W* #[bg=#2e3440]"
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"
set -g message-style "bg=#88c0d0,fg=#2e3440,bold"
