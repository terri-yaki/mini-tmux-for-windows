# Tokyo Night theme for MiniTmux
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 40
set -g status-left "#[bg=#7aa2f7,fg=#15161e,bold]  #S #[bg=#1a1b26,fg=#7aa2f7] "
set -g status-right-length 100
set -g status-right "#[fg=#7aa2f7]%H:%M #[fg=#565f89]| #[fg=#7aa2f7]%d-%b #[bg=#9ece6a,fg=#15161e,bold] MiniTmux "
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[bg=#24283b,fg=#c0caf5,bold] #I:#W* #[bg=#1a1b26]"
set -g pane-border-style "fg=#24283b"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#7aa2f7,fg=#15161e,bold"
