# Catppuccin Mocha theme for MiniTmux
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold]  #S #[bg=#1e1e2e,fg=#89b4fa] "
set -g status-right-length 100
set -g status-right "#[fg=#a6adc8]%H:%M #[fg=#6c7086]| #[fg=#a6adc8]%d-%b #[bg=#a6e3a1,fg=#11111b,bold] MiniTmux "
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I:#W* #[bg=#1e1e2e]"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#89b4fa,fg=#11111b,bold"
