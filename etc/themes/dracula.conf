# Dracula theme for MiniTmux
set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left-length 40
set -g status-left "#[bg=#bd93f9,fg=#282a36,bold]  #S #[bg=#282a36,fg=#bd93f9] "
set -g status-right-length 100
set -g status-right "#[fg=#8be9fd]%H:%M #[fg=#6272a4]| #[fg=#8be9fd]%d-%b #[bg=#50fa7b,fg=#282a36,bold] MiniTmux "
setw -g window-status-format "#[fg=#6272a4] #I:#W "
setw -g window-status-current-format "#[bg=#44475a,fg=#f8f8f2,bold] #I:#W* #[bg=#282a36]"
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"
set -g message-style "bg=#bd93f9,fg=#282a36,bold"
