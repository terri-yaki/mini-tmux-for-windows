name: CI & Automated Verification

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate-windows:
    name: Windows Host Verification
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Core Binaries & Layout
        shell: pwsh
        run: |
          ./bin/mtmux.ps1 doctor

      - name: Run Windows Host Automated Test Suite
        shell: pwsh
        run: |
          ./tests/Test-MiniTmux.ps1

      - name: Verify Packaging Script
        shell: pwsh
        run: |
          ./scripts/Package-MiniTmux.ps1 -OutputDir ./dist

      - name: Upload Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-tmux-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256

  validate-posix:
    name: POSIX (${{ matrix.os }}) Verification
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run POSIX Automated Test Suite
        run: |
          chmod +x bin/mtmux mtmux tests/Test-MiniTmuxPosix.sh
          ./tests/Test-MiniTmuxPosix.sh
